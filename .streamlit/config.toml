[server]
headless = true
address = "0.0.0.0"
port = 8501
enableXsrfProtection = true
maxUploadSize = 50
maxMessageSize = 50

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#e94560"
backgroundColor = "#0a0a0f"
secondaryBackgroundColor = "#1a1a24"
textColor = "#f0f0f5"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = false
