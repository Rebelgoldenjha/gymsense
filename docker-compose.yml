version: '3.8'

services:
  gym-trainer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-gym-trainer
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      # Optional: mount for live code changes during development
      - ./streamlit_app_enhanced.py:/app/streamlit_app_enhanced.py:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Development service with hot reload
  gym-trainer-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ai-gym-trainer-dev
    ports:
      - "8502:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_SERVER_RUN_ON_SAVE=true
    volumes:
      - .:/app
    restart: unless-stopped
    profiles:
      - dev

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: gym-trainer-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - gym-trainer
    restart: unless-stopped
    profiles:
      - production